# ============================================================
# CI pipeline — validate every change to AI Guru / DeepTutor.
#
# Replaces the older `.github/workflows/tests.yml` with a single,
# complete gating pipeline:
#
#   lint       → Ruff lint + format
#   typecheck  → mypy (same relaxed profile as pre-commit; a real gate now
#                that the pre-existing type debt is cleared)
#   security   → detect-secrets (baseline audit) + Bandit (high gate)
#   web        → ESLint, tsc, Node test battery, production build, npm audit
#   python-tests → pytest on Python 3.11/3.12/3.13 (+ 3.14 experimental)
#                 with coverage on 3.11 (uploaded as an artifact)
#   docker     → build production image + run a real container smoke test
#   summary    → per-job result table + hard failure when any gate fails
#
# Triggered on every pull request, on push to the default/release branches,
# and via manual dispatch. Only `push` is path-filtered — see the note at the
# `on:` block for why `pull_request` must never be.
# ============================================================

name: CI

on:
  # ----------------------------------------------------------
  # NOTE ON PATH FILTERS — do NOT re-add a `paths:` block here.
  #
  # A required status check can only ever be satisfied if the workflow
  # actually runs, and GitHub does not back-fill a run for a PR head
  # commit that predates the workflow. Filtering `pull_request` therefore
  # strands any PR whose changed files all fall outside the filter
  # (`.github/**`, `docs/**`, `.secrets.baseline`, `README.md`, …) in a
  # permanent "Expected — Waiting for status to be reported" state: the
  # required checks never report, so the PR can never be merged.
  #
  # Every PR gets the full gate; only the target-branch list narrows it.
  # `push` keeps a path filter, because that only affects long-lived
  # branches where burning a full pipeline on a docs-only commit is waste.
  # Docs-only file kinds (docs/**, README.md, CONTRIBUTING.md,
  # .secrets.baseline) are deliberately NOT in the push list below, so a
  # docs-only push to a long-lived branch skips CI instead of running all
  # six gates. PRs are unfiltered, so docs changes are still fully gated
  # before merge.
  # ----------------------------------------------------------
  push:
    branches:
      - master
      - main
      - dev
      - multi-user
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "deeptutor_web/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "packaging/**"
      - "scripts/**"
      - "web/**"
      - "Dockerfile"
      - "Dockerfile.runner"
      - ".dockerignore"
      - "compose*.yaml"
      - "docker-compose*.yml"
      - ".github/**"
      - ".pre-commit-config.yaml"
  pull_request:
    branches:
      - master
      - main
      - dev
      - multi-user
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ----------------------------------------------------------
  # Python lint & format (accelerated with uv and ruff cache)
  # ----------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lint

      - name: Cache Ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-ruff-

      - name: Install Ruff
        run: uv pip install --system ruff==0.16.0

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ----------------------------------------------------------
  # Python type checking (accelerated with uv and mypy cache)
  # ----------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real gate. The pre-existing type debt (winreg stubs on Linux, the
    # tutor_provider stream typing, and the bank_store / telemetry_logger /
    # python_face_processor annotations) has been cleared, so this now
    # reports 0 errors on the CI profile. Do NOT re-add `continue-on-error`
    # here: at the *job* level it leaves the check conclusion as FAILURE (a
    # red X on every PR) while only softening the workflow run — see the
    # "non-blocking" trap documented in docs/CI-CD.md. If this gate regresses,
    # fix the findings instead.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: typecheck

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-mypy-

      - name: Install mypy
        run: uv pip install --system "mypy==1.13.0" types-PyYAML types-requests types-croniter

      - name: Run mypy
        # Exclusion profile is the single gate definition: keep it identical
        # in .pre-commit-config.yaml and scripts/ci_check.py. api/routers/
        # is intentionally INCLUDED (auth-gated parent portal, exams, and
        # monitoring WS code live there) — probe with zero first-party
        # findings, so any regression here is real, not legacy debt.
        run: |
          mypy --ignore-missing-imports \
               --no-error-summary \
               --no-strict-optional \
               --exclude '^(tests/|scripts/|data/|deeptutor/agents/|deeptutor/services/rag/)' \
               .

  # ----------------------------------------------------------
  # Secret scanning + Python security linter (accelerated with uv)
  # ----------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: security

      - name: Install scanners
        run: uv pip install --system "detect-secrets==1.5.0" "bandit[toml]==1.8.0"

      - name: Detect secrets — no NEW secrets versus .secrets.baseline
        # detect-secrets-hook scans the file list and compares against the
        # committed baseline. Its real exit codes are:
        #   0 → clean
        #   1 → NEW secret found
        #   3 → no new secrets, but baseline line numbers are stale (the hook
        #       rewrites .secrets.baseline in place to refresh them)
        # We collect the file list into a single invocation (instead of
        # `xargs`, which aggregates any 1-125 exit into 123 and would make
        # "new secret" and "stale baseline" indistinguishable) so the hook's
        # genuine exit code survives.
        run: |
          set -euo pipefail
          mapfile -d '' -t FILES < <(
            git ls-files -z \
              | grep -z -vE '^(ictfromabc/|data/)|\.(pdf|zip|lock|tar\.gz)$' || true
          )
          set +e
          if [ "${#FILES[@]}" -gt 0 ]; then
            detect-secrets-hook --baseline .secrets.baseline "${FILES[@]}" > detect-secrets.log 2>&1
            code=$?
          else
            code=0
            : > detect-secrets.log
          fi
          set -e
          case "$code" in
            0)
              echo "✅ No new secrets detected." ;;
            1)
              echo "::error::Potential secrets introduced. Inspect the report below; fix them or add an inline \`pragma: allowlist secret\` for verified false positives."
              cat detect-secrets.log
              exit 1 ;;
            3)
              echo "::warning::No new secrets, but .secrets.baseline line numbers are stale. Run \`pre-commit run detect-secrets --all-files\` locally and commit the refreshed baseline."
              cat detect-secrets.log
              exit 0 ;;
            *)
              echo "::error::detect-secrets-hook failed with exit code ${code}"
              cat detect-secrets.log
              exit 1 ;;
          esac

      - name: Bandit — hard fail on HIGH severity findings
        # Medium findings are reported to the log as warnings; the project's
        # config keeps them intentionally skippable (see [tool.bandit] skips).
        # scripts/ is scanned too: CI helper scripts execute with GITHUB_*
        # context and ship to developers, so HIGH findings there block.
        run: |
          bandit -c pyproject.toml -q -lll -r deeptutor deeptutor_cli scripts || {
            echo "::error::Bandit found HIGH severity issues in Python code."
            exit 1
          }

  # ----------------------------------------------------------
  # Frontend: lint, type-check, tests, production build, audit
  # (accelerated with Next.js build cache and offline npm cache)
  # ----------------------------------------------------------
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit

      - name: ESLint (errors block, warnings allowed)
        working-directory: web
        run: npm run lint

      - name: TypeScript check (tsc --noEmit)
        working-directory: web
        run: npx tsc --noEmit

      - name: Node test battery
        working-directory: web
        run: npm run test:node

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/context/**', 'web/features/**', 'web/hooks/**', 'web/lib/**', 'web/types/**', 'web/locales/**', 'web/public/**', 'web/scripts/**', 'web/proxy.ts', 'web/eslint.config.mjs', 'web/next.config.js', 'web/tailwind.config.js', 'web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-

      - name: Production build (Next.js)
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE: http://localhost:8001
          NEXT_PUBLIC_AUTH_ENABLED: "false"

      - name: npm audit (informational — does not block CI)
        continue-on-error: true
        working-directory: web
        run: npm audit --audit-level=high --omit=dev

  # ----------------------------------------------------------
  # Python tests across supported versions (3.14 experimental)
  # (accelerated with uv wheel cache)
  # ----------------------------------------------------------
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 3.14 is experimental: job-level continue-on-error softens the workflow
    # run but the check conclusion stays FAILURE (red X on the PR) — the
    # "non-blocking" trap documented in docs/CI-CD.md. That is accepted here
    # ONLY because 3.14 is not in requires-python yet. Branch protection must
    # require the `CI Summary` check alone, never an individual matrix entry.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      # One explicit entry per Python version. The previous matrix listed
      # 3.11 in the base list *and* added a second 3.11 via `include:` for
      # coverage, which ran the 3.11 battery twice and reported two check
      # runs under the same "Python Tests (3.11)" name. Coverage is now keyed
      # off the version inside the step instead of a matrix axis.
      matrix:
        include:
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
          cache-dependency-glob: |
            requirements/*.txt
            pyproject.toml
            uv.lock

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements/server.txt -r requirements/partners.txt pytest pytest-asyncio pytest-cov || \
          pip install -r requirements/server.txt -r requirements/partners.txt pytest pytest-asyncio pytest-cov

      - name: Verify dependency tree is consistent
        run: python -m pip check

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run Python tests
        run: |
          COVERAGE_ARGS=""
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            COVERAGE_ARGS="--cov=deeptutor --cov-report=term-missing --cov-report=xml"
          fi
          pytest -q tests deeptutor/learning/tests --durations=10 $COVERAGE_ARGS
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report (Python 3.11)
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-3.11
          path: coverage.xml
          if-no-files-found: warn

  # ----------------------------------------------------------
  # Docker: build the production image and smoke-test backend + frontend
  # ----------------------------------------------------------
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image (amd64, cache enabled)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          push: false
          load: true
          tags: deeptutor:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate sandbox runner image builds (Dockerfile.runner)
        # The runner sidecar is never pushed by any workflow, so without this
        # build check a broken Dockerfile.runner (or a moved server.py) would
        # only surface at deploy time. Build-only, amd64, no cache pressure
        # on the production image entries above.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.runner
          platforms: linux/amd64
          push: false
          load: false
          tags: deeptutor-sandbox-runner:ci-${{ github.sha }}

      - name: Smoke-test container (backend + frontend health endpoints)
        run: |
          IMAGE="deeptutor:ci-${{ github.sha }}"
          docker run -d --name deeptutor-ci \
            -p 127.0.0.1:18001:8001 \
            -p 127.0.0.1:13782:3782 \
            "${IMAGE}"

          backend_ok=0
          backend_degraded=0
          frontend_ok=0

          echo "⏳ Waiting for backend (18001) and frontend (13782) to become healthy..."
          for i in $(seq 1 60); do
            # Fail fast if container crashed/exited prematurely
            if ! docker ps -q --no-trunc | grep -q "$(docker inspect -f '{{.Id}}' deeptutor-ci 2>/dev/null)"; then
              echo "::error::Container exited prematurely during startup!"
              docker logs deeptutor-ci || true
              docker rm -f deeptutor-ci || true
              exit 1
            fi

            # The API liveness probe is REQUIRED: a backend whose root `/`
            # responds but `/api/v1/health/ping` does not has broken route
            # mounting and must not pass the smoke test.
            if [ "$backend_ok" -eq 0 ] && curl -fsS --max-time 5 http://127.0.0.1:18001/api/v1/health/ping >/dev/null 2>&1; then
              backend_ok=1
              echo "✅ Backend API healthy after $((i * 2))s"
            elif [ "$backend_ok" -eq 0 ] && curl -fsS --max-time 5 http://127.0.0.1:18001/ >/dev/null 2>&1; then
              backend_degraded=1
            fi
            if [ "$frontend_ok" -eq 0 ] && curl -fsS --max-time 5 http://127.0.0.1:13782/ >/dev/null 2>&1; then
              frontend_ok=1
              echo "✅ Frontend became healthy after $((i * 2))s"
            fi
            if [ "$backend_ok" -eq 1 ] && [ "$frontend_ok" -eq 1 ]; then
              break
            fi
            sleep 2
          done

          if [ "$backend_ok" -ne 1 ] || [ "$frontend_ok" -ne 1 ]; then
            if [ "$backend_degraded" -eq 1 ]; then
              echo "::error::Backend root '/' responds but /api/v1/health/ping does not — API routes failed to mount."
            else
              echo "::error::Container services did not become healthy within 120s (backend=${backend_ok}, frontend=${frontend_ok})"
            fi
            docker logs deeptutor-ci || true
            docker rm -f deeptutor-ci || true
            exit 1
          fi
          echo "✅ Full production container healthy (Backend + Frontend)."
          docker logs --tail 30 deeptutor-ci || true
          docker rm -f deeptutor-ci || true

  # ----------------------------------------------------------
  # Aggregate results into the job summary; fail the run if any gate failed
  # ----------------------------------------------------------
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, security, web, python-tests, docker]
    if: always()

    steps:
      - name: Write test results summary
        run: |
          format_status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⏹️ Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ $1" ;;
            esac
          }

          {
            echo "## 🚀 CI Pipeline Results"
            echo ""
            echo "Commit: \`${{ github.sha }}\` | Ref: \`${{ github.ref }}\` | Event: \`${{ github.event_name }}\`"
            echo ""
            echo "| Gate | Status | Details |"
            echo "|------|--------|---------|"
            echo "| Ruff lint & format | $(format_status '${{ needs.lint.result }}') | Code formatting & style checks |"
            echo "| mypy type check | $(format_status '${{ needs.typecheck.result }}') | Python static typing profile |"
            echo "| Secret & security scan | $(format_status '${{ needs.security.result }}') | detect-secrets + Bandit high gates |"
            echo "| Web lint / types / tests / build | $(format_status '${{ needs.web.result }}') | ESLint, tsc, node tests, Next.js build |"
            echo "| Python tests (3.11–3.13 + 3.14 exp) | $(format_status '${{ needs.python-tests.result }}') | Multi-version pytest matrix |"
            echo "| Docker build & smoke test | $(format_status '${{ needs.docker.result }}') | Production image + dual backend/frontend probe |"
            echo ""
            if [ "${{ needs.lint.result }}" = "success" ] && \
               [ "${{ needs.typecheck.result }}" = "success" ] && \
               [ "${{ needs.security.result }}" = "success" ] && \
               [ "${{ needs.web.result }}" = "success" ] && \
               [ "${{ needs.python-tests.result }}" = "success" ] && \
               [ "${{ needs.docker.result }}" = "success" ]; then
              echo "🎉 **All CI gates passed! Ready for review / merge.**"
            else
              echo "⚠️ **One or more CI gates failed. Inspect logs for details.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any gate failed
        if: >-
          needs.lint.result != 'success' ||
          needs.typecheck.result != 'success' ||
          needs.security.result != 'success' ||
          needs.web.result != 'success' ||
          needs.python-tests.result != 'success' ||
          needs.docker.result != 'success'
        run: |
          echo "::error::One or more CI gates failed or did not succeed. See the job summary above."
          exit 1
