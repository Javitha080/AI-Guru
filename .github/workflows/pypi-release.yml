name: PyPI Release

# Builds and publishes the Python wheel package (with packaged Next.js assets)
# to PyPI via Trusted Publishing (OIDC).
#
# Supported Triggers:
#   1. Manual dispatch: Actions tab -> PyPI Release (with optional tag & dry-run)
#   2. Reusable workflow call (workflow_call) from other pipelines
#
# NOTE: this workflow deliberately does NOT trigger on `release: published`.
# release.yml already publishes the wheel as part of its own pipeline; a
# `published` trigger here would attempt the same upload a second time and
# fail on "version already exists". Standalone runs are for retries / manual
# publishes via dispatch only.
#
# Unlike release.yml's internal publish (which warns and continues when
# Trusted Publishing is not configured, so a missing PyPI setup can never
# sink a GitHub Release + Docker publish), a MANUAL dispatch fails hard on
# publish errors: the operator explicitly asked for a publish, so silence
# would hide real problems (bad metadata, unconfigured publisher, …).
#
# Expected tag format: vMAJOR.MINOR.PATCH (PEP 440 suffixes allowed).
# PyPI authentication uses Trusted Publishing (no API token secret needed).

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.5.11). Leave empty to use deeptutor/__version__.py"
        required: false
        default: ""
      dry_run:
        description: "Dry run (build and verify only, do not publish to PyPI)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.5.11)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (build and verify only, do not publish to PyPI)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish PyPI Package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/project/deeptutor/

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.tag_name || '' }}"
          if [ -z "$raw" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            raw="${{ github.ref_name }}"
          fi
          echo "tag_candidate=${raw}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release commit is on the default branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/master:refs/remotes/origin/master --no-tags 2>/dev/null || true
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags 2>/dev/null || true

          TARGET_COMMIT="$(git rev-parse HEAD^{commit})"
          is_on_default=0

          if git rev-parse --verify refs/remotes/origin/master >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$TARGET_COMMIT" refs/remotes/origin/master; then
              is_on_default=1
              echo "✅ Verified: target commit $TARGET_COMMIT is on origin/master."
            fi
          fi

          if [ "$is_on_default" -eq 0 ] && git rev-parse --verify refs/remotes/origin/main >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$TARGET_COMMIT" refs/remotes/origin/main; then
              is_on_default=1
              echo "✅ Verified: target commit $TARGET_COMMIT is on origin/main."
            fi
          fi

          if [ "$is_on_default" -ne 1 ]; then
            echo "::error::Commit $TARGET_COMMIT is not on origin/master or origin/main; refusing to publish to PyPI." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: pypi

      - name: Install build tools
        run: uv pip install --system build packaging twine

      - name: Verify release tag matches deeptutor/__version__.py
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version

          src = Path("deeptutor/__version__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find __version__ in deeptutor/__version__.py")
          code_version = str(Version(match.group(1).strip()))

          tag = os.environ.get("RELEASE_TAG", "").strip()
          if tag:
              tag_raw = tag[1:] if tag.startswith("v") else tag
              tag_version = str(Version(tag_raw))
              if code_version != tag_version:
                  raise SystemExit(
                      f"Release tag {tag!r} (normalized {tag_version!r}) does not "
                      f"match deeptutor/__version__.py value {code_version!r}. "
                      "Bump __version__ before tagging."
                  )
          else:
              tag = f"v{code_version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={code_version}\n")
              handle.write(f"tag={tag}\n")
          PY
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag_candidate }}

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/context/**', 'web/features/**', 'web/hooks/**', 'web/lib/**', 'web/types/**', 'web/locales/**', 'web/public/**', 'web/scripts/**', 'web/proxy.ts', 'web/eslint.config.mjs', 'web/next.config.js', 'web/tailwind.config.js', 'web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-

      - name: Build packaged Web assets
        run: python scripts/prepare_web_package.py
        env:
          NEXT_PUBLIC_API_BASE: __NEXT_PUBLIC_API_BASE_PLACEHOLDER__
          NEXT_PUBLIC_AUTH_ENABLED: __NEXT_PUBLIC_AUTH_ENABLED_PLACEHOLDER__
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/deeptutor
          (cd /tmp && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist/deeptutor" "$GITHUB_WORKSPACE")

      - name: Verify package metadata
        run: |
          python -m twine check dist/deeptutor/*
          python - <<'PY'
          from pathlib import Path
          expected = "${{ steps.version.outputs.version }}"
          files = {
              "deeptutor": sorted(path.name for path in Path("dist/deeptutor").glob("*")),
          }
          for package, names in files.items():
              print(package)
              print("\n".join(f"  {name}" for name in names))
          required = [
              ("deeptutor", f"deeptutor-{expected}-py3-none-any.whl"),
          ]
          missing = [name for package, name in required if name not in files[package]]
          if missing:
              raise SystemExit(f"Missing expected distributions: {missing}")
          PY

      - name: Publish deeptutor to PyPI
        if: ${{ inputs.dry_run != true }}
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: dist/deeptutor/
          print-hash: true
