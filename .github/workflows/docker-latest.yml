# ============================================================
# CD — Continuous container publishing to GitHub Container Registry.
#
# Builds the multi-architecture production image and pushes it to the
# repository's own GHCR namespace (ghcr.io/<owner>/<repo>, always lowercase):
#
#   push to master/main → ghcr.io/<owner>/<repo>:{latest, main, sha-<sha>}
#   workflow_dispatch   → same tags plus an optional extra tag (e.g. 1.2.3)
#
# Published GitHub Releases are still handled by the release chain:
#   tag vX.Y.Z → release.yml creates the GitHub Release
#             → docker-release.yml publishes the version-tagged image
#             → pypi-release.yml publishes the PyPI package.
# ============================================================

name: Publish Container (main)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "deeptutor/**"
      - "deeptutor_cli/**"
      - "web/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "Dockerfile.runner"
      - ".dockerignore"
      - ".github/workflows/docker-latest.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra image tag to publish (e.g. 1.2.3 or nightly)"
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Multi-Platform Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          TAGS=("${IMAGE}:${SHA_TAG}")
          # 'latest' is only for default branch merges
          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "master" ]]; then
            TAGS+=("${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME}")
          fi
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAGS+=("${IMAGE}:${{ inputs.image_tag }}")
          fi
          printf 'tags=%s\n' "$(IFS=,; echo "${TAGS[*]}")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
