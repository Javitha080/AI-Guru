name: Docker Release

# Builds a multi-platform Docker image and pushes it to THIS repository's
# GitHub Container Registry (GHCR) namespace.
#
# Supported Triggers:
#   1. Manual dispatch: Actions tab -> Docker Release (with optional tag & dry-run)
#   2. Reusable workflow call (workflow_call) from other pipelines
#
# NOTE: this workflow deliberately does NOT trigger on `release: published`.
# release.yml already builds and pushes the version-tagged image as part of
# its own pipeline; a `published` trigger here would build and push the same
# image a second time on every release (and race the first push). Standalone
# runs are for rebuilds / hotfix images via manual dispatch only.
#
# Image: ghcr.io/<owner>/<repo> (lowercased automatically)
# Tags:
#   - Version tag stripped of 'v' prefix (e.g. release v1.5.11 → image tag 1.5.11)
#   - latest (only for stable, non-prerelease releases)
#
# Platforms: linux/amd64, linux/arm64

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.5.11). Leave empty to use deeptutor/__version__.py"
        required: false
        default: ""
      dry_run:
        description: "Dry run (build only, do not push to GHCR)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.5.11)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (build only, do not push to GHCR)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Multi-Platform Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.tag_name || '' }}"
          if [ -z "$raw" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            raw="${{ github.ref_name }}"
          fi
          echo "tag_candidate=${raw}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.dry_run != true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute registry image and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ steps.tag.outputs.tag_candidate }}"
          if [ -z "$RAW_TAG" ]; then
            # Read from deeptutor/__version__.py
            VERSION=$(python3 -c '
          import re
          from pathlib import Path
          m = re.search(r"^__version__\s*=\s*\"([^\"]+)\"", Path("deeptutor/__version__.py").read_text(encoding="utf-8"), re.M)
          print(m.group(1) if m else "unknown")
          ')
            RAW_TAG="v${VERSION}"
          else
            VERSION="${RAW_TAG#v}"
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS=("${IMAGE}:${VERSION}")
          # Prerelease predicate is shared with release.yml: PEP 440
          # prerelease (via packaging when available) OR an
          # alpha/beta/rc/dev/preview suffix. Keep the two in sync so both
          # publishers agree on whether `:latest` moves.
          IS_PRERELEASE=$(python3 -c "
          import re
          raw_tag = '''$RAW_TAG'''
          try:
              from packaging.version import Version
              base = raw_tag[1:] if raw_tag.startswith('v') else raw_tag
              is_pre = Version(base).is_prerelease or bool(
                  re.search(r'[-_](alpha|beta|rc|dev|preview)', raw_tag, re.I))
          except Exception:
              tag = raw_tag.lower()
              is_pre = bool(re.search(r'[-_](alpha|beta|rc|dev|preview)|\b(rc|alpha|beta|dev)\d*\b', tag)) or ('-' in tag)
          print('true' if is_pre else 'false')
          ")
          if [ "$IS_PRERELEASE" != "true" ]; then
            TAGS+=("${IMAGE}:latest")
          fi

          printf 'tags=%s\n' "$(IFS=,; echo "${TAGS[*]}")" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${RAW_TAG}, image tags: ${TAGS[*]}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.dry_run != true }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
